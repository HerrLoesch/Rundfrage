# One service (003 FR-001, SC-001): the application, which serves both the API and the built web
# assets from one origin. The database container is gone with the database - all persistent state
# is one file in the mounted volume below (003 FR-002).
#
# Every value has an inline default, so `docker compose up` works on a fresh clone with no .env
# file and no manual setup step (001 FR-001, 003 SC-003).

services:
  app:
    build:
      context: .
      dockerfile: docker/Dockerfile
    # The port inside the container. A reverse proxy that shares a network with this service -
    # Coolify's Traefik does - reaches it here, over the container network, and needs no
    # published port at all.
    expose:
      - "8080"
    # Bound to the loopback address by default, which is what makes the line above the only way
    # in from outside the host. Published on every interface, the application would ALSO sit on
    # the server's public address on port 8080, beside the proxy and without its TLS - a second
    # front door that nobody opened on purpose and that no certificate covers.
    #
    # Local use is unaffected: http://localhost:8080 is the loopback address.
    #
    # Set APP_BIND=0.0.0.0 for a deployment that really is meant to publish the port itself,
    # with nothing in front of it.
    ports:
      - "${APP_BIND:-127.0.0.1}:${APP_PORT:-8080}:8080"
    environment:
      # Where the storage file lives inside the container. The volume below is mounted here, so
      # the data survives `docker compose down` and is copied by copying the volume.
      DATA_DIR: ${DATA_DIR:-/data}
      LOG_LEVEL: ${LOG_LEVEL:-Information}
      # FR-027a's ten per hour is the default. Raised only for end-to-end runs, which submit
      # far more than that from one machine; leave it unset for anything resembling production.
      SUBMISSION_LIMIT_PER_HOUR: ${SUBMISSION_LIMIT_PER_HOUR:-10}
      # 009 FR-036's sixty per hour is the default, and is separate from the budget above so a
      # creator and a participant on one address cannot spend each other's (research R-5).
      CREATOR_WRITE_LIMIT_PER_HOUR: ${CREATOR_WRITE_LIMIT_PER_HOUR:-60}
      # Number of reverse proxies in front of the application. Zero here, because this file
      # publishes the port itself and there is nothing in between - a forwarded header would be
      # the caller's own claim about themselves. Set it only where a proxy really does stand in
      # front, or the rate limit above degrades into one shared budget for every participant.
      TRUSTED_PROXY_COUNT: ${TRUSTED_PROXY_COUNT:-0}
      # Deliberately WITHOUT defaults. Feature 001 could start on built-in values because it
      # exposed nothing; an admin area that creates polls must not (002 FR-045, FR-045a).
      #
      # Passed through empty rather than declared required here: the refusal belongs to the
      # application (002 SC-015), so that `docker compose config` stays usable and the failure
      # arrives as one clear application error instead of a substitution error.
      ADMIN_USER: ${ADMIN_USER:-}
      ADMIN_PASSWORD_HASH: ${ADMIN_PASSWORD_HASH:-}
    volumes:
      # Named volume so the storage survives stop and restart (003 FR-006).
      #
      # Take backups through the admin area, not by copying the file out of here: while the
      # system is running, a copy of the main file alone is silently short - sometimes by a few
      # answers, sometimes by every one of them including the schema (003 FR-003b, research R-3).
      - rundfrage-data:/data
    restart: unless-stopped

volumes:
  # Left without an explicit `name:` on purpose, and that is a decision with a sharp edge on it.
  #
  # Compose derives the real volume name from the project; an orchestrator derives it from the
  # resource. Either way it is stable as long as the deployment is, and a plain redeploy keeps
  # the data. But if the name ever shifts - the resource is recreated, the service renamed - the
  # application is handed an EMPTY volume, creates the schema, and serves an empty poll list.
  # Nothing about that looks like a failure. The startup warning in Program.cs is what catches
  # it; see "Betrieb unter Coolify" in README.md for pinning the name to the one in use.
  rundfrage-data:
